<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nadabid Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-4 flex flex-col justify-between">

  <!-- Header Section -->
  <header class="flex justify-between items-center border-b border-slate-800 pb-3">
    <h1 class="text-xl font-bold text-amber-400">Nadabid</h1>
    <div class="bg-slate-800 px-3 py-1 rounded-full text-xs font-semibold text-emerald-400">
      🎟️ Balance: <span id="user-tickets">--</span> Tickets
    </div>
  </header>

  <!-- Main Active Auction -->
  <main class="my-auto space-y-4">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
      <span class="text-xs font-semibold uppercase tracking-wider text-amber-400">Auction #101</span>
      <h2 class="text-lg font-bold">Samsung Galaxy S24 Ultra</h2>
      <p class="text-xs text-slate-400 mb-2">Retail: 110,000 ETB</p>
      
      <div class="text-sm font-mono bg-slate-900 py-1.5 rounded-lg text-rose-400 font-bold mb-4">
        ⏱️ Closes in: 00:45:12
      </div>

      <!-- 7-Slot Bidding Form -->
      <h3 class="text-sm font-semibold mb-2 text-slate-200">Enter Your 7 Unique Guesses (ETB):</h3>
      <div class="grid grid-cols-2 gap-2 text-left mb-4" id="slots-container">
        <!-- 7 Input fields generated dynamically -->
      </div>

      <button onclick="submitSevenBids()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3 rounded-lg shadow-lg active:scale-95 transition">
        🚀 SUBMIT ALL 7 BIDS (Deducts 1 Ticket)
      </button>
    </div>
  </main>

  <!-- Package Store Modal Button -->
  <footer>
    <button onclick="toggleStore(true)" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2.5 rounded-lg text-sm text-center">
      💳 Buy More Tickets (Telebirr / Chapa)
    </button>
  </footer>

  <!-- Package Store Modal -->
  <div id="store-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4 relative">
      <button onclick="toggleStore(false)" class="absolute top-3 right-3 text-slate-400 text-lg">✕</button>
      <h3 class="text-lg font-bold text-amber-400 text-center">Recharge Tickets</h3>

      <!-- Tier 1 -->
      <div class="border border-slate-700 p-3 rounded-xl flex justify-between items-center">
        <div>
          <div class="font-bold text-sm">Starter Pack</div>
          <div class="text-xs text-slate-400">1 Ticket (7 Bids)</div>
        </div>
        <button onclick="buyPackage('starter')" class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">20 ETB</button>
      </div>

      <!-- Tier 2 -->
      <div class="border border-slate-700 p-3 rounded-xl flex justify-between items-center">
        <div>
          <div class="font-bold text-sm">Popular Pack</div>
          <div class="text-xs text-slate-400">3 Tickets (21 Bids)</div>
        </div>
        <button onclick="buyPackage('popular')" class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">50 ETB</button>
      </div>

      <!-- Tier 3 (Decoy / Recommended) -->
      <div class="border-2 border-amber-500 bg-amber-500/10 p-3 rounded-xl flex justify-between items-center">
        <div>
          <div class="font-bold text-sm text-amber-400">VIP Mega Pack 🔥</div>
          <div class="text-xs text-slate-300">7 Tickets (49 Bids) + Auto-Bot</div>
        </div>
        <button onclick="buyPackage('vip')" class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">100 ETB</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Open full screen in Telegram

    const userId = tg.initDataUnsafe?.user?.id || 12345678; // Fallback for testing
    const BACKEND_URL = window.location.origin; // Uses your live Render backend URL automatically

    // Render 7 Input Slots
    const container = document.getElementById('slots-container');
    for (let i = 1; i <= 7; i++) {
      container.innerHTML += `
        <div>
          <label class="text-[10px] text-slate-400">Slot ${i}</label>
          <input type="number" step="0.01" id="slot-${i}" placeholder="e.g. ${(10 + i * 2.5).toFixed(2)}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm font-mono text-amber-400 focus:outline-none focus:border-amber-500">
        </div>
      `;
    }

    function toggleStore(show) {
      document.getElementById('store-modal').classList.toggle('hidden', !show);
    }

    async function submitSevenBids() {
      const bidAmounts = [];
      for (let i = 1; i <= 7; i++) {
        const val = parseFloat(document.getElementById(`slot-${i}`).value);
        if (isNaN(val)) return tg.showAlert("Please fill in all 7 slots!");
        bidAmounts.push(val);
      }

      tg.MainButton.setText("Submitting...").show();

      try {
        const res = await fetch(`${BACKEND_URL}/api/bids/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, auctionId: 101, bidAmounts })
        });
        const data = await res.json();
        tg.MainButton.hide();

        if (data.success) {
          tg.showAlert("✅ Success! Your 7 bids have been placed.");
        } else {
          tg.showAlert("❌ Error: " + data.error);
        }
      } catch (err) {
        tg.MainButton.hide();
        tg.showAlert("Server connection error.");
      }
    }

    function buyPackage(tier) {
      tg.showAlert(`Redirecting to payment for ${tier.toUpperCase()} pack...`);
    }
  </script>
</body>
</html>
